# 読み取り索引 (impact-index) — 「何を読めば足りるか」のルーティング表
#
# 目的: 実装・設計セッションが巨大な文書やコードを全文読みせず、
# 「小さい索引 → 該当 feature の read: が指すファイルだけ」を読めるようにする (token 最小化)。
#
# 読み取り順序 (実装ガード):
# 1. 本ファイルを読み、今回触る feature / キーワードで該当エントリを引く
# 2. エントリの read: が指すファイルだけを読む (初回はこれ以外を全文読みしない)
# 3. source_refs: (specs / ADR) は大きいので、判断が付かないときだけ読む
# 4. 該当エントリが無い場合: repo 全体の探索へ逃げず、新規 feature なら
#    先に仮エントリ (coverage: partial) を足してから作業に入る
#
# 育て方: spec-lifecycle の sync phase と context-harvest skill が
# feature の追加・変更時にエントリを更新する。coverage: partial は未整備の印。

features:
  - name: "docs-operation"
    keywords:
      [
        "specs",
        "closeout",
        "spec 削除",
        "ドキュメント運用",
        "正本境界",
        "デザイン正本",
        "DesignDoc 記述方針",
        "C4 図",
      ]
    read:
      - "adr/0011-specs-closeout-enforcement.md"
      - "adr/0012-design-source-of-truth-implementation.md"
      - "adr/0013-designdoc-present-facts-only.md"
      - "context/design-workflow.md"
    source_refs:
      - "specs/31-docs-restructure/index.md (作業中のみ。issue #31 close 時に削除)"
    coverage: "partial" # DesignDoc / design-workflow の本文書き換えは別 issue で実施予定

  - name: "<feature 名 (例: contact-form)>"
    keywords: ["<検索の手掛かり>", "<API 名>", "<画面名>"]
    read: # このエントリを触るとき最初に読むファイル (小さく保つ)
      - "<context/<topic>.md の該当ファイル>"
      - "<design/features/<feature>/DesignDoc_<feature>.md>"
    source_refs: # 必要時のみ読む (初回は読まない)。spec は issue close 時に削除されるため、closeout で ADR / feature doc に差し替える
      - "<specs/<issue-id>-<slug>/index.md (作業中のみ)>"
      - "<adr/NNNN-*.md>"
    coverage: "<full / partial>" # partial = context 未整備の印 (context-harvest で補完する)
