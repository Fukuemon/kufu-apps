# 読み取り索引 (impact-index) — 「何を読めば足りるか」のルーティング表
#
# 目的: 実装・設計セッションが巨大な文書やコードを全文読みせず、
# 「小さい索引 → 該当 feature の read: が指すファイルだけ」を読めるようにする (token 最小化)。
#
# 読み取り順序 (実装ガード):
# 1. 本ファイルを読み、今回触る feature / キーワードで該当エントリを引く
# 2. エントリの read: が指すファイルだけを読む (初回はこれ以外を全文読みしない)
# 3. source_refs: (specs / ADR) は大きいので、判断が付かないときだけ読む
# 4. 該当エントリが無い場合: repo 全体の探索へ逃げず、新規 feature なら
#    先に仮エントリ (coverage: partial) を足してから作業に入る
#
# 育て方: spec-lifecycle の sync phase と context-harvest skill が
# feature の追加・変更時にエントリを更新する。coverage: partial は未整備の印。

features:
  - name: "component-architecture"
    keywords:
      [
        "sections",
        "components/sections",
        "index.ts 公開面",
        "depcruise 境界",
        "Storybook カタログ",
        "autodocs",
        "cva",
        "globals.css",
        "styles 分割",
        "ハードコード基準",
        "motion トークン",
      ]
    read: # このエントリを触るとき最初に読むファイル (小さく保つ)
      - "context/component-design.md"
      - "context/architecture.md"
      - "design/features/corporate-site/DesignDoc_corporate-site.md"
    source_refs: # 必要時のみ読む (初回は読まない)
      - "adr/0014-corporate-site-sections-architecture.md"
      - "adr/0007-design-token-architecture.md"
      - "https://github.com/Fukuemon/kufu-apps/issues/32 (決定経緯)"
    coverage: "full"

  - name: "docs-operation"
    keywords:
      [
        "specs",
        "closeout",
        "spec 削除",
        "ドキュメント運用",
        "正本境界",
        "デザイン正本",
        "DesignDoc 記述方針",
        "C4 図",
      ]
    read:
      - "adr/0011-specs-closeout-enforcement.md"
      - "adr/0012-design-source-of-truth-implementation.md"
      - "adr/0013-designdoc-present-facts-only.md"
      - "context/design-workflow.md"
      - "design/DesignDoc.md"
      - "specs/README.md"
    source_refs:
      - "https://github.com/Fukuemon/kufu-apps/issues/31 (決定経緯)"
    coverage: "full"

  - name: "testing-strategy"
    keywords:
      [
        "テスト種別",
        "Unit test",
        "play",
        "interaction test",
        "E2E",
        "Playwright",
        "Page Object",
        "locator",
        "data-testid",
        "getByRole",
        "ユーザージャーニー",
        "VRT",
        "視覚回帰",
        "storycap",
        "reg-suit",
        "toHaveScreenshot",
        "baseline",
        "許容 diff",
      ]
    read:
      - "context/testing.md"
      - "design/features/corporate-site/DesignDoc_corporate-site.md"
    source_refs:
      - "adr/0015-visual-regression-testing-policy.md"
      - "adr/0017-ui-test-structure-policy.md"
      - "https://github.com/Fukuemon/kufu-apps/issues/33 (決定経緯)"
    coverage: "full"

  - name: "ci-pipeline"
    keywords:
      [
        "CI",
        "GitHub Actions",
        "workflows",
        "lefthook",
        "pre-commit",
        "required status checks",
        "Turbo キャッシュ",
        "quality gate",
        "typecheck",
        "knip",
        "depcruise",
        "R2",
        "secret",
        "baseline 保管先",
      ]
    read:
      - "context/engineering.md"
      - "context/toolchain.md"
      - "context/infrastructure.md"
    source_refs:
      - "adr/0016-ci-local-hook-responsibility.md"
      - "adr/0015-visual-regression-testing-policy.md"
      - "https://github.com/Fukuemon/kufu-apps/issues/33 (決定経緯)"
    coverage: "full"

  - name: "<feature 名 (例: contact-form)>"
    keywords: ["<検索の手掛かり>", "<API 名>", "<画面名>"]
    read: # このエントリを触るとき最初に読むファイル (小さく保つ)
      - "<context/<topic>.md の該当ファイル>"
      - "<design/features/<feature>/DesignDoc_<feature>.md>"
    source_refs: # 必要時のみ読む (初回は読まない)
      - "<adr/NNNN-*.md>"
    coverage: "<full / partial>" # partial = context 未整備の印 (context-harvest で補完する)
