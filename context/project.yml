version: 2

hosting: github

docs:
  design: docs/design
  adr: docs/adr
  spec: docs/specs

e2e:
  dir: e2e

# パッケージ screens が読む。tokens_css と catalog_url は、design_system と同じく、足す条件が整うまで省く
# e2e_dir は、E2E の testid を画面仕様書のモックと照らすと決めたときに足す
screens:
  dir: docs/screens

# パッケージ design-system が読む。tokens_css と catalog_url は、足す条件が整うまで省く
design_system: {}

process:
  defaults:
    processes:
      [
        requirements,
        design,
        implementation,
        verification-design,
        verification,
        integration,
        release,
      ]
    reflect_at: design
    breakdown_at: design
    review: [requirements, design, integration]
  # 要求の種別。要求の雛形の「種別」の選択肢と同じ名前にする
  presets:
    feature:
      processes:
        [
          requirements,
          design,
          implementation,
          verification-design,
          verification,
          integration,
          release,
        ]
      reflect_at: design
      breakdown_at: design
      review: [requirements, design, integration]
      tasks: [design, impl, verify, docs]
    screen:
      processes:
        [
          requirements,
          design,
          implementation,
          verification-design,
          verification,
          integration,
          release,
        ]
      reflect_at: design
      breakdown_at: design
      review: [requirements, design, integration]
      tasks: [design, impl, verify]
    design-system:
      processes: [requirements, design, implementation, integration]
      reflect_at: design
      breakdown_at: design
      review: [requirements, design, integration]
      tasks: [design, impl, docs]
    bug:
      processes: [implementation, verification, integration]
      reflect_at: none
      breakdown_at: none
      review: [integration]
      tasks: []
    refactoring:
      processes: [design, implementation, verification, integration]
      reflect_at: design
      breakdown_at: design
      review: [design, integration]
      tasks: [impl]
    maintenance:
      processes: [implementation, integration]
      reflect_at: none
      breakdown_at: none
      review: [integration]
      tasks: []
    docs:
      processes: [implementation, integration]
      reflect_at: none
      breakdown_at: none
      review: [integration]
      tasks: []
    prototype:
      processes: [design]
      reflect_at: none
      breakdown_at: none
      review: [design]
      tasks: []
  additional: []
