# git hooks。有効化: pnpm install (prepare が lefthook install を実行する)

pre-commit:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-commit
    # 整形した結果だけを stage_fixed で staging へ戻す。明示的な git add を使うと、
    # 部分 stage したファイルの未 stage 変更まで commit に巻き込む。
    # ステージしたファイルがすべて整形の対象外（.prettierignore）でも失敗させない
    format:
      glob: "*.{js,cjs,mjs,jsx,ts,tsx,json,md,css,yml,yaml}"
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      run: pnpm lint
    # 文章の規則。経緯の混入とリンクは編集後のフックと CI が見る
    textlint:
      glob: "*.md"
      run: pnpm exec textlint {staged_files}

pre-push:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-push

commit-msg:
  commands:
    ticket-number:
      glob: "**/*"
      run: hooks/commit-msg/check_ticket_number.sh {1}
    # 形式と AI の帰属表示の禁止は commitlint.config.mjs が持つ
    commitlint:
      run: pnpm exec commitlint --edit {1}
