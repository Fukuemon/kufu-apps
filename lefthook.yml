# CI とローカル hook の分担 (正本: adr/0016-ci-local-hook-responsibility.md)。
#
# - ローカル hook は**速いフィードバック**を担う。commit を止めない範囲の検査だけを置く。
# - CI (.github/workflows/lint.yml / ci.yml) は**迂回できない gate** を担う。pre-commit は
#   `--no-verify` で素通しできるため、lint / test / typecheck / build / knip / depcruise /
#   e2e / route VRT は CI 側にも置く。
# - 同じ検査が両方で走ることは**意図的な二重化**として許容する。CI にあるからといって
#   ここから削らない。
# - typecheck / build / e2e / VRT はここに足さない。commit のたびに走らせるには重く、
#   速いフィードバックという役割から外れるため。CI が最後の砦として拾う。

pre-commit:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-commit
    format:
      run: hooks/format/run_oxfmt.sh
    repo-analysis:
      run: hooks/quality/validate_repo_analysis.sh
    lint:
      run: pnpm lint

pre-push:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-push

commit-msg:
  commands:
    ticket-number:
      glob: "**/*"
      run: hooks/commit-msg/check_ticket_number.sh {1}
    # AI の attribution trailer を落とす。.claude/settings.json で無効化して
    # いるが、それでも入った commit が積み上がったため機械検査を置く。
    no-ai-attribution:
      run: bash hooks/commit-msg/check_no_ai_attribution.sh {1}

# git worktree を作った直後に共有プロセス層を繋ぐ。
# 配布は symlink で追跡されないため、worktree には配布物が 1 つも来ない。
# 手当てしないと lefthook.yml だけが残り、hook が silent に no-op になる。
post-checkout:
  commands:
    link-worktree:
      run: bash scripts/link-worktree.sh
