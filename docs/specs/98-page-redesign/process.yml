# issue 98 の開発プロセスの宣言。種別 screen のプリセット（context/project.yml）のとおり
preset: screen
processes:
  - requirements
  - design
  - implementation
  - verification-design
  - verification
  - integration
  - release
reflect_at: design
breakdown_at: design
review: [requirements, design, integration]
tasks: [design, impl, verify]

progress:
  requirements: done
  # 運営者が論点を全て決めた。ADR-0037 の承認と、残る論点 3 つを待つ。分解はタスクの下書きまで行い、起票は運営者の確認の後
  design: in-review
  breakdown: in-review
  implementation: not-started
  verification-design: not-started
  verification: not-started
  integration: not-started
  release: not-started
