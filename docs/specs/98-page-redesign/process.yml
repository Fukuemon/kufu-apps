# issue 98 の開発プロセスの宣言。種別 screen のプリセット（context/project.yml）のとおり
preset: screen
processes:
  - requirements
  - design
  - implementation
  - verification-design
  - verification
  - integration
  - release
reflect_at: design
breakdown_at: design
review: [requirements, design, integration]
tasks: [design, impl, verify]

progress:
  requirements: done
  # 運営者が案 A を選んだ。整えた案と画面仕様書を出し、残る論点の答えを待つ。答えの後に分解を行う
  design: in-review
  breakdown: not-started
  implementation: not-started
  verification-design: not-started
  verification: not-started
  integration: not-started
  release: not-started
