# story 側 VRT の baseline を置くローカル S3 互換ストレージ。この baseline は破棄前提で、
# 正となる baseline は #47 の完了後に R2 へ移す (ADR-0015)。
# 起動手順と資格情報の渡し方は README.md の「story 側 VRT」節。

name: kufu-vrt

services:
  vrt-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    # 資格情報は git 管理外の .env から渡す。未設定なら素通しさせず失敗させる。
    environment:
      MINIO_ROOT_USER: ${VRT_S3_ACCESS_KEY_ID:?README.md の VRT 節に従って .env へ設定してください}
      MINIO_ROOT_PASSWORD: ${VRT_S3_SECRET_ACCESS_KEY:?README.md の VRT 節に従って .env へ設定してください}
    # バケットは /data 直下のディレクトリとして作る。1 回限りのジョブを別サービスに分けると
    # 正常終了でも docker compose up --wait が失敗扱いにする。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /data/kufu-vrt-baseline &&
        exec minio server /data --address ":9000" --console-address ":9001"
    # ローカル検証専用のため loopback にだけ bind する。
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - vrt-storage-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:9000/minio/health/live",
        ]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  vrt-storage-data:
