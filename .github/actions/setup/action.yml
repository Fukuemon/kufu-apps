name: Setup
description: pnpm と Node を用意して依存を入れる

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        # 24 以上: vitest 設定が import する .ts (packages/config) の
        # type stripping が既定で有効 (22.12 では ERR_UNKNOWN_FILE_EXTENSION)
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
