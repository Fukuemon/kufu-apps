name: Setup
description: pnpm と Node を用意して依存を入れる

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        # 手元と同じにするため、mise.toml の node と同じ値にする
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
