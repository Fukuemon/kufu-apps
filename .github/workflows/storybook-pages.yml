name: Storybook Pages

on:
  push:
    branches:
      - develop
  pull_request:
    paths:
      - ".github/workflows/storybook-pages.yml"
      - "apps/corporate-site/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/build-storybook-pages.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Storybook catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook Pages artifact
        run: pnpm storybook:pages

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .storybook-pages

  deploy:
    name: Deploy Storybook catalog
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
