# lint の必須 gate (pre-commit は --no-verify で素通しできるため)
name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # PR ブランチへの push は pull_request 側が拾う (二重実行の回避)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 24 以上: vitest 設定が import する .ts (packages/config) の
          # type stripping が既定で有効 (22.12 では ERR_UNKNOWN_FILE_EXTENSION)
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep # check-token-usage.mjs が使う (runner 標準に無い)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
