# 迂回できない quality gate (正本: adr/0016)。
# lint.yml と分けるのは、job 名が required status checks の契約になるため。
# job 間に needs を置かない。実行順序は設計で決めておらず、順序依存を持ち込まない。

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      update-route-vrt-baseline:
        description: "route VRT の baseline を撮り直して artifact に上げる"
        type: boolean
        default: false
      update-story-vrt-baseline:
        description: "story VRT の baseline を撮り直して artifact に上げる"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 既定権限に依存させない。
permissions:
  contents: read

# checkout と install の重複は、並列を優先した結果として許容する。
jobs:
  typecheck:
    # PR ブランチへの push は pull_request 側が拾う (二重実行の回避)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 24 以上: vitest 設定が import する .ts (packages/config) の
          # type stripping が既定で有効 (22.12 では ERR_UNKNOWN_FILE_EXTENSION)
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  build:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  # knip と depcruise は project.yml が pnpm check として 1 組で扱う。
  analyze:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Knip
        run: pnpm knip
      - name: Dependency cruiser
        run: pnpm depcruise

  e2e:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      # route VRT は container 実行を条件に skip されるため、このジョブでは smoke だけが走る。
      - name: E2E
        run: pnpm e2e
      # trace を PR から辿れるようにする。playwright-report/ は reporter 未指定のため出ない。
      - name: Upload E2E artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # story 側の VRT。撮影と判定は CI に一本化する (spec D8)。
  # @storybook/addon-vitest は撮影時に Vite のバンドルを回すため container 実行と両立しない。
  # runner は amd64 なので、ここで撮った baseline が正になる。
  vrt-story:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Story VRT
        if: ${{ inputs.update-story-vrt-baseline != true }}
        run: pnpm vrt:story
      # baseline の撮り直し。artifact の PNG を commit して取り込む。
      - name: Update story VRT baseline
        if: ${{ inputs.update-story-vrt-baseline == true }}
        run: pnpm vrt:story:update
      - name: Upload updated baseline
        if: ${{ inputs.update-story-vrt-baseline == true }}
        uses: actions/upload-artifact@v4
        with:
          name: vrt-story-baseline
          path: vrt/baseline/
          retention-days: 7
          if-no-files-found: error
      - name: Upload VRT diff
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vrt-story-diff
          path: .vrt/
          retention-days: 7
          if-no-files-found: ignore

  # route 側の VRT。ローカルと同じ pnpm vrt:route を通す。playwright test を直に叩くと
  # image 版の導出・起動条件・件数検査が CI 側だけ抜ける。差分が出たら失敗させる (D12)。
  vrt-route:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # @playwright/test の版を読むために要る。撮影は container 内の install を使う。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Route VRT
        if: ${{ inputs.update-route-vrt-baseline != true }}
        run: pnpm vrt:route
      # baseline の正は CI で撮った画像とする (D8)。artifact の PNG を commit して取り込む。
      - name: Update route VRT baseline
        if: ${{ inputs.update-route-vrt-baseline == true }}
        run: pnpm vrt:route:update
      - name: Upload updated baseline
        if: ${{ inputs.update-route-vrt-baseline == true }}
        uses: actions/upload-artifact@v4
        with:
          name: vrt-route-baseline
          path: e2e/corporate-site/route-vrt.spec.ts-snapshots/
          retention-days: 7
          if-no-files-found: error
      # timeout はキャンセル扱いで failure() に入らないため !cancelled() にする。
      - name: Upload VRT diff
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vrt-route-diff
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
